[SwingSprintVR]
#
# ---------------
# Live Reload:
# Any change to the file while the game is running will be detected and applied immediately.
# File location: Documents\My Games\Fallout4VR\Mods_Config\SwingSprintVR\SwingSprintVR.ini
#
# -----
# MCM:
# When Mod Configuration Menu (MCM VR) is installed, the settings shown in its "Swing Sprint VR" page
# override the same settings in this file. Settings MCM doesn't show (e.g. fSprintTapDuration) stay here.


# ===== Movement speed by location =====

# Set the player's movement speed separately for interiors and exteriors.
# false restores the default speed (100).
bSpeedByCellEnabled = true

# Speed multiplier in interiors (buildings, vaults, caves). 100 = game default.
fInteriorSpeedMult = 80

# Speed multiplier in exteriors (the open world, Diamond City). 100 = game default.
fExteriorSpeedMult = 100

# The game only applies a new speed when carry weight changes; this nudges carry weight to apply it at once.
bSpeedRefreshNudge = true


# ===== Sprint by swinging arms =====

# Sprint while swinging the controllers like running arms, instead of pressing the sprint button.
bSwingSprintEnabled = true

# The button the game uses for sprint: "<hand> <button>".
# Hands: offhand, primary, left, right. Buttons: thumbstick, grip, trigger, a, b.
sSprintButton = offhand thumbstick

# hold: the button is held while swinging (game sprints while held).
# tap: a short press when swinging starts and another when it stops (game toggles sprint on each press).
sSprintMode = hold

# How long one press lasts in tap mode, in seconds.
fSprintTapDuration = 0.15

# Only count swings where the hands move in opposite directions, like running arms.
bRequireAlternatingArms = true

# Hand speed (meters per second, relative to the headset) that starts the sprint. Higher = harder swing needed.
fSwingStartSpeed = 1.4

# Hand speed below which the sprint stops. Keep lower than fSwingStartSpeed.
fSwingStopSpeed = 0.8

# Smoothing of the swing speed in seconds. Higher = steadier but slower to react.
fSwingSmoothing = 0.25

# How long the swing must stay slow before the sprint stops, in seconds.
fSprintStopDelay = 0.4


# ===== Testing =====

# Live stats floating in front of you, updated in real time: location, speed target and current SpeedMult,
# measured movement speed, hand and swing speed against the start/stop thresholds, and sprint state.
# Use it to see how a change in this file or in MCM works while you move.
bShowLiveStats = false


[Debug]

# The level of log message to output; 2 - info (basic), 1 - debug (more logs), 0 - trace (A LOT of logs)
iLogLevel = 2

# Sets the spdlog output pattern for each normal log message.
sLogPattern = %H:%M:%S.%e %l: %v

# Mod-defined numeric scratch values for runtime experiments; blank values load as 0.
fFlowFlag1 = 0
fFlowFlag2 = 0
fFlowFlag3 = 0
sFlowText1 =
sFlowText2 =

sAdjustTarget = none
sDumpDataOnceNames =
sAddItemsOnceNames =

# In-world debug draw overlay (used by bShowLiveStats)
bDebugDrawEnabled = true
sDebugDrawToggleBinding = none
sDebugDrawDisabledChannels =
sDebugDrawHudPlacement = center-top-left
sSceneDepthStrategy = auto
bSceneDepthDiagnostics = false

# Internal use for versioning
iVersion = 2
